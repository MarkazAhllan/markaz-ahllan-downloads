<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B1A2B">
<title>سجّل في نادي العملاء — مركز أهلاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#8B1A2B;--p2:#5E0F1C;--bg:#f7f1f2;--s:#fff;--t:#231719;--t2:#6e6062;--l:#ecdfe1;--ok:#16825D;--e:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#140b0d;--s:#1f1416;--t:#f5ecee;--t2:#b9a9ac;--l:#33242a}}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 18px 70px;text-align:center}.top small{opacity:.85}.top h1{margin:4px 0 0;font-size:22px}
.wrap{max-width:560px;margin:-52px auto 30px;padding:0 14px}
.card{background:var(--s);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(60,10,20,.12);margin-bottom:12px}
.msg{text-align:center;padding:40px 10px;color:var(--t2)}.msg b{display:block;font-size:20px;color:var(--t);margin:8px 0}
h3{margin:0 0 6px;font-size:17px}.meta{color:var(--t2);font-size:14px;line-height:1.9}
label{display:block;font-size:13px;color:var(--t2);font-weight:700;margin:12px 0 4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--l);background:var(--s);color:var(--t)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;border:1.5px solid var(--l);background:var(--s);color:var(--t);cursor:pointer}.chips button.on{background:var(--p);border-color:var(--p);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:14px;font:inherit;font-size:16px;font-weight:800;border:0;background:var(--p);color:#fff;cursor:pointer;margin-top:16px;text-decoration:none}
.btn.wa{background:#25D366}.btn:disabled{opacity:.6}
.err{color:var(--e);font-size:13.5px;margin-top:8px;min-height:1em}
.ok{text-align:center;padding:26px 8px}.ok .ic{font-size:50px}.ok b{display:block;font-size:20px;margin:6px 0}
.foot{text-align:center;color:var(--t2);font-size:12px;margin-top:6px;line-height:1.8}
.gift{background:#fff4e0;color:#8a5200;border-radius:14px;padding:12px;font-weight:800;text-align:center;margin-top:10px}@media (prefers-color-scheme:dark){.gift{background:#3a2a0e;color:#f3c77a}}
.perks{list-style:none;padding:0;margin:10px 0 0;line-height:2.1;font-size:15px}.chk{display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--t2);font-size:13.5px;margin-top:12px}.chk input{width:auto;margin-top:4px}
</style>
</head>
<body>
<div class="top"><small>نادي العملاء</small><h1 id="shop">…</h1></div>
<div class="wrap" id="app"><div class="card msg">⏳ جاري التحميل…</div></div>
<script>
const SUPA = 'https://inxlleknypxzegzgzmfl.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlueGxsZWtueXB4emVnemd6bWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzcwMzQsImV4cCI6MjEwNzkxMzAzNH0.JzWJf2nE5rhYGKQBtPRbf9RBA-0C7lIGw-IM0uTtu2s';
const S = new URLSearchParams(location.search).get('s') || '';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rpc = (fn, body) => fetch(SUPA + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(async (r) => { const j = await r.json().catch(() => null); if (!r.ok) throw new Error((j && j.message) || 'HTTP ' + r.status); return j; });
const $ = (s) => document.querySelector(s); const show = (h) => ($('#app').innerHTML = h);
const wa = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '20' + d.slice(1); return d; };
const digits = (s) => String(s || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g, '');
let C = null;
async function load() {
  if (!/^[A-Za-z0-9]{8,40}$/.test(S)) return show('<div class="card msg">🔗<b>الكود مش كامل</b>امسح الكود اللي في المحل تاني.</div>');
  try {
    C = await rpc('pos_book_info', { p_token: S });
    if (!C || C.kind !== 'join') return show('<div class="card msg">🔎<b>الصفحة مش موجودة</b></div>');
    $('#shop').textContent = C.name || ''; document.title = 'سجّل في نادي العملاء — ' + (C.name || '');
    if (C.on === false) return show(`<div class="card msg">🔒<b>التسجيل متوقف دلوقتي</b>اسأل الكاشير يسجّلك.</div>`);
    render();
  } catch (e) { show('<div class="card msg">📶<b>مفيش اتصال</b>اتأكد من النت وجرّب تاني.</div>'); }
}
function render() {
  show(`<div class="card"><h3>🪪 سجّل وخد كارتك</h3><ul class="perks"><li>⭐ نقاط وأختام مع كل زيارة</li><li>🎁 هدايا وعروض ليك انت بس</li><li>📱 حسابك وأجهزتك وضماناتك على موبايلك</li></ul>${C.gift ? `<div class="gift">🎁 هدية التسجيل: ${esc(C.gift)}</div>` : ''}</div>
  <div class="card"><label>الاسم</label><input id="nm" autocomplete="name" maxlength="60"><label>رقم الموبايل (واتساب)</label><input id="ph" type="tel" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx" maxlength="14">
  <label class="chk"><input type="checkbox" id="ok" checked> موافق إن المحل يبعتلي كارتي وعروضه على واتساب</label>
  <button class="btn" id="go">✨ سجّلني</button><div class="err" id="er"></div></div>
  <div class="foot">${esc(C.name || '')}${C.address ? ' · ' + esc(C.address) : ''}<br>Markaz Ahllan POS · م/ أسامة حسن بدري</div>`);
  try { const s = JSON.parse(localStorage.getItem('mah:join') || '{}'); if (s.done === S) return done(s.name); } catch (_) {}
  $('#go').onclick = send;
}
function done(name) {
  show(`<div class="card ok"><div class="ic">🎉</div><b>أهلاً بيك يا ${esc(String(name || '').split(' ')[0])}!</b><div style="color:var(--t2);line-height:1.9">اتسجلت في نادي عملاء ${esc(C.name || '')} ✓<br>كارتك هيوصلك على واتساب خلال دقايق.<br>${C.gift ? `<div class="gift">🎁 ${esc(C.gift)} — قول للكاشير إنك سجّلت</div>` : 'قول للكاشير إنك سجّلت.'}</div>${C.phone ? `<a class="btn wa" href="https://wa.me/${wa(C.phone)}">💬 كلّم المحل واتساب</a>` : ''}</div><div class="foot">Markaz Ahllan POS · م/ أسامة حسن بدري</div>`);
}
async function send() {
  const er = $('#er'); er.textContent = '';
  const d = { kind: 'join', name: $('#nm').value.trim().slice(0, 60), phone: digits($('#ph').value) };
  if (d.name.length < 2) return (er.textContent = 'اكتب اسمك');
  if (!/^01[0125][0-9]{8}$/.test(d.phone)) return (er.textContent = 'اكتب رقم موبايل صحيح (11 رقم)');
  if (!$('#ok').checked) return (er.textContent = 'لازم توافق عشان يوصلك الكارت على واتساب');
  const b = $('#go'); b.disabled = true; b.textContent = '⏳ جاري التسجيل…';
  try {
    await rpc('pos_book_add', { p_token: S, p_data: d }); try { localStorage.setItem('mah:join', JSON.stringify({ done: S, name: d.name })); } catch (_) {}
    done(d.name);
  } catch (e) { b.disabled = false; b.textContent = '✨ سجّلني'; er.textContent = /duplicate/.test(e.message) ? 'اتسجلت قبل كده ✓ — كارتك جاي على واتساب.' : /busy/.test(e.message) ? 'فيه ضغط دلوقتي — جرّب كمان شوية أو اسأل الكاشير.' : /closed/.test(e.message) ? 'التسجيل متوقف دلوقتي.' : 'حصلت مشكلة — جرّب تاني.'; }
}
load();
</script>
</body>
</html>
