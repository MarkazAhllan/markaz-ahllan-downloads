<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B1A2B">
<title>حسابي — مركز أهلاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#8B1A2B;--p2:#5E0F1C;--bg:#f7f1f2;--s:#fff;--t:#231719;--t2:#6e6062;--l:#ecdfe1;--ok:#16825D;--okb:#e7f5ee;--w:#B26A00;--wb:#fff4e0;--e:#b3261e;--eb:#fdeceb}

*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 18px 70px;text-align:center}

.wrap{max-width:560px;margin:-52px auto 30px;padding:0 14px}
.card{background:var(--s);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(60,10,20,.12);margin-bottom:12px}
.st{display:flex;align-items:center;gap:12px}.st .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--wb);flex:none}
.st.ok .ic{background:var(--okb)}.st.e .ic{background:var(--eb)}.st b{font-size:21px;display:block}.st span{color:var(--t2);font-size:13.5px}

.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;position:relative;padding:0 0 16px}.tl li:not(:last-child)::before{content:'';position:absolute;top:28px;bottom:0;inset-inline-start:13px;width:2px;background:var(--l)}
.tl i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none;background:var(--l);color:var(--t2);font-weight:900}
.tl li.done i{background:var(--ok);color:#fff}.tl li.now i{background:var(--p);color:#fff;box-shadow:0 0 0 5px rgba(139,26,43,.15)}.tl b{display:block;font-size:15px}.tl small{color:var(--t2)}.tl li.todo b{color:var(--t2);font-weight:600}

.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;border:1.5px solid var(--l);color:var(--t);background:var(--s)}.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.msg{text-align:center;padding:40px 10px;color:var(--t2)}.msg b{display:block;font-size:20px;color:var(--t);margin:8px 0}
.foot{text-align:center;color:var(--t2);font-size:12px;margin-top:6px;line-height:1.8}
.upd{font-size:12px;color:var(--t2);text-align:center;margin-top:8px}

.hello{font-size:15px;color:var(--t2)}.bal{font-size:34px;font-weight:900;margin:4px 0}.bal.due{color:var(--e)}.bal.ok{color:var(--ok)}
.sec h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--l);font-size:14px}.row:last-child{border-bottom:0}.row small{color:var(--t2);display:block;font-size:12px}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;background:var(--wb);color:var(--w)}.pill.ok{background:var(--okb);color:var(--ok)}.pill.e{background:var(--eb);color:var(--e)}
.pts{display:flex;align-items:center;gap:14px}.pts b{font-size:28px}
a.lnk{color:var(--p);font-weight:800;text-decoration:none}
.idc{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-align:center;position:relative;overflow:hidden}
.idc::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);top:-90px;inset-inline-start:-70px}
.idc small{opacity:.85}.idc .nm{font-size:20px;font-weight:900;margin:2px 0 10px}.idc .qr{background:#fff;border-radius:16px;padding:10px;width:200px;margin:0 auto;position:relative;z-index:1}.idc .qr svg{width:100%;height:auto;display:block}
.idc .no{font-size:22px;font-weight:900;letter-spacing:4px;direction:ltr;margin-top:10px}.idc .hint{font-size:13px;opacity:.9;margin-top:4px}
.stp{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 10px}.stp i{aspect-ratio:1;width:100%;max-width:52px;justify-self:center;border-radius:50%;border:2px dashed var(--l);display:grid;place-items:center;font-style:normal;font-weight:900;color:var(--t2);font-size:13px}
.stp i.on{background:var(--ok);border:2px solid var(--ok);color:#fff}.stp i.last{border-color:var(--w);color:var(--w)}.gw{display:block;margin:16px auto 0;padding:8px;background:none;border:0;cursor:pointer;position:relative;z-index:1;max-width:100%}.gw img{display:block;height:50px;width:auto;max-width:100%}.gw:disabled{opacity:.6}.gwe{font-size:12.5px;margin-top:6px;opacity:.9}.gwsm{display:inline-block;padding:0;margin-top:6px;background:none;border:0;cursor:pointer}.gwsm img{height:36px;width:auto;display:block}.tierb{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 12px;font-weight:800;font-size:13.5px;margin:-4px 0 10px}
.gift{background:var(--wb);color:var(--w);border-radius:14px;padding:10px 12px;font-weight:800;text-align:center}
.clm{margin-top:8px;padding:12px;border-radius:14px;background:var(--bg);text-align:right}.fld{display:block;font-size:13px;color:var(--t2);margin:8px 0 4px}.inp{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--l);background:var(--s);color:var(--t)}textarea.inp{min-height:70px;resize:vertical}
.cb{font:inherit;font-weight:800;font-size:13px;border:1.5px solid var(--p);color:var(--p);background:none;border-radius:99px;padding:4px 12px;margin-top:6px;cursor:pointer}.cb.full{width:100%;background:var(--p);color:#fff;padding:11px;border-radius:12px;font-size:15px;margin-top:10px}.cb:disabled{opacity:.6}.note{font-size:13px;margin-top:6px;line-height:1.8}.note.e{color:var(--e)}.note.ok{color:var(--ok)}
.spc{border:2px solid var(--ok)}.spc .big{font-size:15px;line-height:1.9}
</style>
<script src="js/qr.js"></script>
</head>

}
function show(h) { document.getElementById('app').innerHTML = h; }
function render(d, upd) {
  const c = d.cur; document.getElementById('shop').textContent = d.store?.name || ''; document.title = 'حسابي — ' + (d.store?.name || '');
  const b = Number(d.bal) || 0;
async function gwAdd(btn, body) {

  try { const r = await fetch(SUPA + '/functions/v1/wallet-pass', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok || !j.url) throw new Error(j.error || r.status); location.href = j.url; }

}

const isAndroid = /Android/i.test(navigator.userAgent);
  const t0 = new URLSearchParams(location.search).get('t') || '';
  let h = '';
  if (d.no && typeof QR !== 'undefined') { const u = location.origin + location.pathname + '?t=' + encodeURIComponent(t0) + '&n=' + encodeURIComponent(d.no); h += `<div class="card idc"><small>🪪 كارت العميل</small><div class="nm">${esc(d.name)}</div>${d.tier ? `<div class="tierb">${esc(d.tier.e)} عضو ${esc(d.tier.n)}</div>` : ''}<div class="qr">${QR.svg(u, { ecl: 'M' })}</div><div class="no">${esc(String(d.no).replace(/(\d{4})(\d{4})/, '$1 $2'))}</div><div class="hint">ورّي الكارت ده للكاشير في كل زيارة</div>${d.gw && /Android/i.test(navigator.userAgent) ? `<button class="gw" id="gwBtn" aria-label="الإضافة إلى محفظة Google"><img src="gw-ar.svg" alt="الإضافة إلى محفظة Google" width="312" height="50"></button><div class="gwe" id="gwErr"></div>` : ''}</div>`; }
  if (d.gift) h += `<div class="card"><div class="gift">🎁 هدية التسجيل مستنياك: ${esc(d.gift)}</div></div>`;

      go.disabled = true; nt.className = 'note'; nt.textContent = '⏳ بنبعت…';
      try { await inbox(d.ib, { kind: 'claim', t: t0, w: b.dataset.clm, k: b.dataset.k, issue, phone: ph, name: String(d.name || '').trim().length >= 2 ? String(d.name).slice(0, 40) : 'عميل' }); HOLD = 0; f.innerHTML = '<div class="note ok" style="font-weight:800;font-size:14px">✅ طلب الضمان وصل المحل — هيكلموك وتقدر تعدّي بالجهاز.</div>'; b.remove(); }
      catch (e) { go.disabled = false; nt.className = 'note e'; nt.textContent = ERR(e.message); }
    };
  }));
  document.querySelectorAll('[data-gww]').forEach((b) => (b.onclick = () => gwAdd(b, { act: 'link', t: t0, w: b.dataset.gww })));
  const gb = document.getElementById('gwBtn'); if (gb) gb.onclick = async () => {
    const er = document.getElementById('gwErr'); gb.disabled = true; er.textContent = '⏳ لحظة…';
    try { const r = await fetch(SUPA + '/functions/v1/wallet-pass', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ act: 'link', t: t0 }) }); const j = await r.json(); if (!r.ok || !j.url) throw new Error(j.error || r.status); location.href = j.url; }
    catch (e) { gb.disabled = false; er.textContent = 'مقدرناش نجهّز الكارت دلوقتي — جرّب كمان شوية.'; }
  };
}
let HOLD = 0;
load(); setInterval(() => { if (Date.now() - HOLD > 180000) load(); }, 120000);
