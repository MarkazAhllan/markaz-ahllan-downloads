<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B1A2B">
<title>تابع جهازك — مركز أهلاً</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p:#8B1A2B;--p2:#5E0F1C;--bg:#f7f1f2;--s:#fff;--t:#231719;--t2:#6e6062;--l:#ecdfe1;--ok:#16825D;--okb:#e7f5ee;--w:#B26A00;--wb:#fff4e0;--e:#b3261e;--eb:#fdeceb}
@media (prefers-color-scheme:dark){:root{--bg:#140b0d;--s:#1f1416;--t:#f5ecee;--t2:#b9a9ac;--l:#33242a;--okb:#123326;--wb:#3a2a0e;--eb:#3a1614}}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.top{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:22px 18px 70px;text-align:center}
.top small{opacity:.85}.top h1{margin:4px 0 0;font-size:22px}
.wrap{max-width:560px;margin:-52px auto 30px;padding:0 14px}
.card{background:var(--s);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(60,10,20,.12);margin-bottom:12px}
.st{display:flex;align-items:center;gap:12px}.st .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:30px;background:var(--wb);flex:none}
.st.ok .ic{background:var(--okb)}.st.e .ic{background:var(--eb)}.st b{font-size:21px;display:block}.st span{color:var(--t2);font-size:13.5px}
.dev{margin-top:12px;padding-top:12px;border-top:1px dashed var(--l);display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}.dev span{color:var(--t2)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;gap:12px;position:relative;padding:0 0 16px}.tl li:not(:last-child)::before{content:'';position:absolute;top:28px;bottom:0;inset-inline-start:13px;width:2px;background:var(--l)}
.tl i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;flex:none;background:var(--l);color:var(--t2);font-weight:900}
.tl li.done i{background:var(--ok);color:#fff}.tl li.now i{background:var(--p);color:#fff;box-shadow:0 0 0 5px rgba(139,26,43,.15)}.tl b{display:block;font-size:15px}.tl small{color:var(--t2)}.tl li.todo b{color:var(--t2);font-weight:600}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.money div{background:var(--bg);border-radius:14px;padding:10px 4px}.money small{color:var(--t2);font-size:12px;display:block}.money b{font-size:17px}.money .due b{color:var(--p)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px;border-radius:14px;font:inherit;font-weight:800;text-decoration:none;border:1.5px solid var(--l);color:var(--t);background:var(--s)}.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.msg{text-align:center;padding:40px 10px;color:var(--t2)}.msg b{display:block;font-size:20px;color:var(--t);margin:8px 0}
.foot{text-align:center;color:var(--t2);font-size:12px;margin-top:6px;line-height:1.8}
.upd{font-size:12px;color:var(--t2);text-align:center;margin-top:8px}
.gw{display:block;margin:12px auto 0;padding:8px;background:none;border:0;cursor:pointer;max-width:100%}.gw img{display:block;height:50px;width:auto;max-width:100%}.gw:disabled{opacity:.6}.gwe{font-size:12.5px;text-align:center;color:var(--t2)}
.ap{border:2px solid var(--w)}.ap h3{margin:0 0 8px;font-size:17px}.apd{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.8;margin-bottom:8px}.ape{font-size:16px;margin-bottom:10px}.ape b{font-size:24px;color:var(--p)}
.fld{display:block;font-size:13px;color:var(--t2);margin:8px 0 4px}.inp{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--l);background:var(--s);color:var(--t)}textarea.inp{min-height:64px;resize:vertical}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.no{color:var(--e);border-color:var(--e)}button.btn{cursor:pointer;width:100%}button.btn:disabled{opacity:.6}.note{font-size:13.5px;margin-top:8px;text-align:center;line-height:1.8}.note.ok{color:var(--ok)}.note.e{color:var(--e)}
.sent{background:var(--okb);color:var(--ok);border-radius:14px;padding:12px;text-align:center;font-weight:800;line-height:1.9}
.dia svg{width:100%;max-width:300px;display:block;margin:6px auto 0}.leg{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--t2);margin-top:4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}.inl{font-size:14px;line-height:2;color:var(--t2)}
@media (prefers-color-scheme:dark){.dia svg .ph{fill:#2a2022}.dia svg .sc{fill:#1d2a35}}
</style>
</head>
<body>
<div class="top"><small>تابع جهازك</small><h1 id="shop">…</h1></div>
<div class="wrap" id="app"><div class="card msg">⏳ جاري التحميل…</div></div>
<script>
const SUPA = 'https://inxlleknypxzegzgzmfl.supabase.co', ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlueGxsZWtueXB4emVnemd6bWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzcwMzQsImV4cCI6MjEwNzkxMzAzNH0.JzWJf2nE5rhYGKQBtPRbf9RBA-0C7lIGw-IM0uTtu2s';
const ST = { received: ['تم الاستلام', '📥'], diagnosing: ['جاري الفحص', '🔍'], approval: ['بانتظار موافقتك على التكلفة', '⏳'], parts: ['بانتظار قطع غيار', '📦'], repairing: ['جاري الإصلاح', '🛠️'], ready: ['جاهز للاستلام', '✅'], unrepairable: ['تعذر الإصلاح', '⚠️'], delivered: ['تم التسليم', '🤝'] };
async function gwAdd(btn, body) {
  const er = btn.parentNode.querySelector('.gwe'); btn.disabled = true; if (er) er.textContent = '⏳ لحظة…';
  try { const r = await fetch(SUPA + '/functions/v1/wallet-pass', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok || !j.url) throw new Error(j.error || r.status); location.href = j.url; }
  catch (e) { btn.disabled = false; if (er) er.textContent = 'مقدرناش نجهّز الكارت دلوقتي — جرّب كمان شوية.'; }
}
const GW_BTN = (attrs) => `<button class="gw" ${attrs} aria-label="الإضافة إلى محفظة Google"><img src="gw-ar.svg" alt="الإضافة إلى محفظة Google" width="312" height="50"></button><div class="gwe"></div>`;
const isAndroid = /Android/i.test(navigator.userAgent);

const KN = [['#d92d20', 'كسر'], ['#e08a00', 'خدش'], ['#1f6feb', 'خبطة']];
function diaSVG(mk) {
  const ph = (x) => `<rect class="ph" x="${x}" y="8" width="90" height="176" rx="15" fill="#fff" stroke="#888" stroke-width="2.4"/>`;
  return `<svg viewBox="0 0 220 206" xmlns="http://www.w3.org/2000/svg">${ph(10)}<rect class="sc" x="17" y="24" width="76" height="144" rx="5" fill="#eef3f8" stroke="#9aa4ae" stroke-width="1.2"/><rect x="45" y="14" width="20" height="4" rx="2" fill="#777"/>${ph(120)}<rect x="128" y="18" width="34" height="38" rx="9" fill="none" stroke="#888" stroke-width="1.4"/><circle cx="137" cy="28" r="5.2" fill="none" stroke="#888" stroke-width="1.4"/><circle cx="137" cy="45" r="5.2" fill="none" stroke="#888" stroke-width="1.4"/><text x="55" y="200" text-anchor="middle" font-size="10" fill="#999">قدام</text><text x="165" y="200" text-anchor="middle" font-size="10" fill="#999">ضهر</text>${mk.map((m, i) => `<circle cx="${m[0]}" cy="${m[1]}" r="7.5" fill="${(KN[m[2]] || KN[0])[0]}" stroke="#fff" stroke-width="1.6"/><text x="${m[0]}" y="${m[1] + 3.4}" text-anchor="middle" font-size="9.5" font-weight="900" fill="#fff">${i + 1}</text>`).join('')}</svg>`;
}
function legend(mk) { const c = {}; mk.forEach((m) => (c[m[2]] = (c[m[2]] || 0) + 1)); return `<div class="leg">${KN.map((k, i) => (c[i] ? `<span><i style="background:${k[0]}"></i>${k[1]} × ${c[i]}</span>` : '')).join('')}</div>`; }
const digits = (s) => String(s || '').replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
async function inbox(ib, data) {
  const r = await fetch(SUPA + '/rest/v1/rpc/pos_book_add', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: ib, p_data: data }) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(String(j.message || j.error || r.status)); return j;
}
const ERR = (e) => /duplicate/.test(e) ? 'اتبعت من شوية ✓ — لو عايز تغيّر رأيك كلّم المحل.' : /required/.test(e) ? 'اكتب رقم موبايلك صح (11 رقم).' : /busy/.test(e) ? 'فيه ضغط دلوقتي — جرّب كمان دقيقة.' : /closed/.test(e) ? 'الخدمة دي مش متاحة دلوقتي — كلّم المحل.' : 'مفيش اتصال — جرّب تاني.';
let HOLD = 0;
const FLOW = ['received', 'diagnosing', 'repairing', 'ready', 'delivered'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dt = (s) => { try { return new Date(s).toLocaleString('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }); } catch (_) { return ''; } };
const m = (v, c) => `${Number(v || 0).toLocaleString('ar-EG-u-nu-latn', { maximumFractionDigits: 2 })} ${esc(c || 'ج.م')}`;
const wa = (p) => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '20' + d.slice(1); return d; };
async function load() {
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[A-Za-z0-9]{10,40}$/.test(t)) return show('<div class="card msg">🔗<b>الرابط مش كامل</b>امسح الكود اللي على إيصال الاستلام تاني.</div>');
  try {
    const r = await fetch(SUPA + '/rest/v1/rpc/pos_track_get', { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: t }) });
    const j = await r.json(); if (!j || !j.data) return show('<div class="card msg">🔎<b>مش لاقيين الجهاز ده</b>ممكن البيانات لسه ما اترفعتش — جرّب كمان شوية.</div>');
    if (Date.now() - HOLD < 180000) return; render(j.data, j.updated_at);
  } catch (e) { if (!document.getElementById('apBox')) show('<div class="card msg">📶<b>مفيش اتصال</b>اتأكد من النت وجرّب تاني.</div>'); }
}
function show(h) { document.getElementById('app').innerHTML = h; }
function render(d, upd) {
  document.getElementById('shop').textContent = d.store?.name || ''; document.title = 'تابع جهازك — ' + (d.store?.name || '');
  const s = d.stage; const info = ST[s] || ST.received; const cls = s === 'ready' || s === 'delivered' ? 'ok' : s === 'unrepairable' ? 'e' : '';
  const when = {}; (d.hist || []).forEach((h) => (when[h.s] = h.at));
  let flow = FLOW.slice(); if (s === 'approval' || when.approval) flow.splice(2, 0, 'approval'); if (s === 'parts' || when.parts) flow.splice(flow.indexOf('repairing'), 0, 'parts'); if (s === 'unrepairable' || when.unrepairable) flow = ['received', 'diagnosing', 'unrepairable', 'delivered'];
  const cur = flow.indexOf(s);
  const tl = flow.map((k, i) => `<li class="${i < cur ? 'done' : i === cur ? 'now' : 'todo'}"><i>${i < cur ? '✓' : i + 1}</i><div><b>${ST[k][0]}</b>${when[k] ? `<small>${dt(when[k])}</small>` : ''}</div></li>`).join('');
  const T0 = new URLSearchParams(location.search).get('t') || ''; const ap = d.ap || null; const sentK = 'ap:' + T0 + ':' + (ap && ap.est);
  let sent = null; try { sent = localStorage.getItem(sentK); } catch (_) {}
  const msg = s === 'ready' ? 'جهازك جاهز — تقدر تعدّي تستلمه في أي وقت 🌹' : s === 'approval' ? (ap && ap.ib ? 'الفني فحص الجهاز — شوف التكلفة تحت ووافق بضغطة' : `الفني فحص الجهاز${d.estimate ? ` والتكلفة المتوقعة ${m(d.estimate, d.cur)}` : ''} — كلّمنا عشان نبدأ`) : s === 'delivered' ? `اتسلّم ${d.warrantyUntil ? `— ضمان لحد ${dt(d.warrantyUntil)}` : ''}` : s === 'unrepairable' ? 'للأسف ماقدرناش نصلّحه — تقدر تستلمه من المحل' : 'شغالين عليه — هنبلّغك أول ما يخلص';
  show(`<div class="card"><div class="st ${cls}"><div class="ic">${info[1]}</div><div><b>${info[0]}</b><span>${esc(msg)}</span></div></div>
    <div class="dev"><span>الجهاز</span><b>${esc(d.device)}</b><span>رقم الإيصال</span><b>${esc(d.no)}</b>${d.issue ? `<span>العطل</span><b>${esc(d.issue)}</b>` : ''}<span>الاستلام</span><b>${dt(d.date)}</b></div></div>
    ${s === 'approval' && ap && ap.ib ? (sent && ap.st !== 'no' ? `<div class="card"><div class="sent">${sent === 'ok' ? '✅ موافقتك وصلت المحل — هيبدأوا في الإصلاح ونبلّغك أول ما يخلص' : '📩 ردّك وصل المحل — هيكلموك'}</div><div class="note"><a href="#" id="apAgain" style="color:var(--t2)">الحالة ما اتغيّرتش بعد شوية؟ ابعت تاني</a></div></div>` : `<div class="card ap" id="apBox"><h3>💬 الفني فحص جهازك</h3>${ap.diag ? `<div class="apd"><b>التشخيص:</b> ${esc(ap.diag)}</div>` : ''}${ap.est ? `<div class="ape">التكلفة المتوقعة: <b>${m(ap.est, d.cur)}</b></div>` : ''}${ap.st === 'no' ? '<div class="note e" style="margin:0 0 8px">انت رفضت التكلفة قبل كده — لو غيّرت رأيك تقدر توافق من هنا</div>' : ''}
      <label class="fld" for="apPh">للتأكيد: اكتب رقم موبايلك اللي سجّلته عندنا</label><input class="inp" id="apPh" inputmode="tel" dir="ltr" autocomplete="tel" placeholder="01xxxxxxxxx">
      <label class="fld" for="apNote">ملاحظة للمحل (اختياري)</label><textarea class="inp" id="apNote" maxlength="200"></textarea>
      <div class="act" style="margin-top:12px"><button class="btn ok" data-ap="1">✅ موافق — ابدأوا</button><button class="btn no" data-ap="0">✖ مش موافق</button></div><div class="note" id="apMsg"></div></div>`) : ''}
    ${ap && ap.st === 'ok' && s !== 'approval' ? `<div class="card inl">✅ وافقت على التكلفة${ap.est ? ` (${m(ap.est, d.cur)})` : ''} — ${dt(ap.at)}</div>` : ''}
    ${d.total || d.paid ? `<div class="card money"><div><small>الإجمالي</small><b>${m(d.total, d.cur)}</b></div><div><small>المدفوع</small><b>${m(d.paid, d.cur)}</b></div><div class="due"><small>المتبقي</small><b>${m(d.due, d.cur)}</b></div></div>` : ''}
    ${d.gw && isAndroid && s !== 'delivered' ? `<div class="card" style="text-align:center"><b>🔔 خليه في محفظة موبايلك</b><div style="color:var(--t2);font-size:13.5px;margin-top:4px">يوصلك إشعار أول ما الجهاز يجهز</div>${GW_BTN('id="gwRep"')}</div>` : ''}
    <div class="card"><ul class="tl">${tl}</ul></div>
    ${d.in ? `<div class="card"><b>📋 حالة الجهاز وقت الاستلام</b>${d.in.m && d.in.m.length ? `<div class="dia">${diaSVG(d.in.m)}</div>${legend(d.in.m)}` : ''}<div class="inl">${d.in.c ? `الحالة: ${esc(d.in.c)}<br>` : ''}${d.in.sg ? '✍️ اتسجّلت الحالة دي وانت وقّعت عليها وقت الاستلام<br>' : ''}${d.in.ph ? `📷 اتصوّر الجهاز ${d.in.ph} ${d.in.ph > 2 ? 'صور' : 'صورة'} في المحل` : ''}</div></div>` : ''}
    ${d.store?.phone ? `<div class="act"><a class="btn wa" href="https://wa.me/${wa(d.store.phone)}?text=${encodeURIComponent('أهلاً، بسأل على جهازي رقم ' + d.no)}">💬 واتساب</a><a class="btn" href="tel:${esc(d.store.phone)}">📞 اتصال</a></div>` : ''}
    <div class="upd">آخر تحديث: ${dt(d.at || upd)} — الصفحة بتتحدث لوحدها</div>
    <div class="foot">${esc(d.store?.name || '')}${d.store?.address ? ' · ' + esc(d.store.address) : ''}<br>Markaz Ahllan POS · م/ أسامة حسن بدري</div>`);
  const again = document.getElementById('apAgain'); if (again) again.onclick = (e) => { e.preventDefault(); try { localStorage.removeItem(sentK); } catch (_) {} render(d, upd); };
  const box = document.getElementById('apBox');
  if (box) {
    box.addEventListener('input', () => (HOLD = Date.now())); box.addEventListener('focusin', () => (HOLD = Date.now()));
    box.querySelectorAll('[data-ap]').forEach((b) => (b.onclick = async () => {
      const ok = b.dataset.ap === '1'; const ph = digits(document.getElementById('apPh').value); const mm = document.getElementById('apMsg'); mm.className = 'note';
      if (ph.length < 10) { mm.className = 'note e'; mm.textContent = 'اكتب رقم موبايلك اللي سجّلته في المحل (11 رقم).'; return; }
      if (!ok && !confirm('متأكد إنك مش موافق على التكلفة؟')) return;
      box.querySelectorAll('button').forEach((x) => (x.disabled = true)); mm.textContent = '⏳ بنبعت…';
      try { await inbox(ap.ib, { kind: 'rap', t: T0, ok, phone: ph, name: 'عميل صيانة', note: document.getElementById('apNote').value.trim().slice(0, 200) }); try { localStorage.setItem(sentK, ok ? 'ok' : 'no'); } catch (_) {} HOLD = 0;
        box.outerHTML = `<div class="card"><div class="sent">${ok ? '✅ موافقتك وصلت المحل — هيبدأوا في الإصلاح ونبلّغك أول ما يخلص' : '📩 ردّك وصل المحل — هيكلموك'}<br><small style="font-weight:600">لو الرقم مش مطابق للمسجّل عندنا الطلب مش هيتقبل — كلّم المحل</small></div></div>`; }
      catch (e) { box.querySelectorAll('button').forEach((x) => (x.disabled = false)); mm.className = 'note e'; mm.textContent = ERR(e.message); }
    }));
  }
  const gb = document.getElementById('gwRep'); if (gb) gb.onclick = () => gwAdd(gb, { act: 'link', t: new URLSearchParams(location.search).get('t') || '' });
}
load(); setInterval(load, 60000);
</script>
</body>
</html>
